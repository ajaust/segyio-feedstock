{% set name = "segyio" %}
{% set version = "1.9.15" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/equinor/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: da04bed9bc666c9e569e7f86f23c946850c4926b505ddf96f340449a49596a5d

build:
  number: 0
  skip: True  # [py<311]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake
    - make  # [unix]
    - ninja  # [win]
  host:
    - python
    - pip
    - scikit-build-core
    - numpy
  run:
    - python
    - numpy >=1.10

test:
  imports:
    - segyio
    - segyio._segyio

about:
  home: https://github.com/equinor/segyio
  license: LGPL-3.0-or-later
  license_family: GPL
  license_file: License.md
  summary: 'Simple and fast SEG-Y I/O'

  description: |
    segyio is a fast and practical library for reading and writing seismic data
    in SEG-Y format. segyio is random access oriented for modern computers with
    simple read/write primitives on lines.
  doc_url: http://segyio.readthedocs.io/
  dev_url: https://github.com/equinor/segyio

extra:
  recipe-maintainers:
    - sveinung-r
    - jokva
